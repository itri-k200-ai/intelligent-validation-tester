services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ivt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ivt
      POSTGRES_USER: ivt
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ivtpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # host 5432 留給 near-rt-ric agent、5433 留給 imctrl-db；IVT 用 5434 避免衝突
    ports: ["127.0.0.1:${IVT_POSTGRES_PORT:-5434}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivt"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ivt-redis
    restart: unless-stopped
    volumes: [redis_data:/data]
    ports: ["127.0.0.1:${IVT_REDIS_PORT:-6379}:6379"]

  minio:
    image: minio/minio:latest
    container_name: ivt-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [minio_data:/data]
    ports: ["127.0.0.1:${IVT_MINIO_PORT:-9000}:9000", "127.0.0.1:${IVT_MINIO_CONSOLE_PORT:-9001}:9001"]

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: ivt-mediamtx
    restart: unless-stopped
    volumes:
      - ../media-server/mediamtx.yml:/mediamtx.yml
    ports:
      - "127.0.0.1:${IVT_MEDIAMTX_RTSP_PORT:-8554}:8554"
      - "127.0.0.1:${IVT_MEDIAMTX_HLS_PORT:-8888}:8888"
      - "127.0.0.1:${IVT_MEDIAMTX_API_PORT:-9997}:9997"

  backend-web:
    build: ../backend
    container_name: ivt-backend-web
    restart: unless-stopped
    # 車載 MJPEG 影像是長連線(/api/field-tests/camera/<情境>/stream/,後端代理
    # 外部平台的 B6),gunicorn 預設 --timeout 30 會在 30 秒把處理它的 worker
    # 砍掉 —— 症狀就是牆上影像出現約半分鐘後消失。實測正好 30.5 秒。
    #   --timeout 0    不對長連線設上限(牆是整天掛著的,任何有限值都會切)
    #   gthread + 8 threads
    #                  sync worker 被串流佔住時整個 process 都不能做別的事,
    #                  3 個 worker 有 1~2 條串流就快餓死。改成執行緒模型,
    #                  串流只佔一條 thread。
    command: >
      gunicorn config.wsgi --bind 0.0.0.0:8000
      --worker-class gthread --workers 3 --threads 8 --timeout 0
    env_file: ../backend/.env
    # 場域測試要打同一台主機上的 IM adapter(FIELD_TEST_ADAPTER_BASE),
    # 走 host-gateway 出去 —— 與 nginx 同一個做法,.env 就不必寫死主機 IP。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    # host 8000 留給 near-rt-ric agent；正式入口走 nginx :8080
    ports: ["127.0.0.1:${IVT_BACKEND_WEB_PORT:-8002}:8000"]

  backend-ws:
    build: ../backend
    container_name: ivt-backend-ws
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    env_file: ../backend/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    # 注意:8001 常被 RICtester 那套的 nmagent 佔用,同機部署要改 IVT_BACKEND_WS_PORT。
    # nginx 是走 compose 內網 backend-ws:8001,這個對外埠只供 debug。
    ports: ["127.0.0.1:${IVT_BACKEND_WS_PORT:-8001}:8001"]

  celery-worker:
    build: ../backend
    container_name: ivt-celery
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file: ../backend/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  celery-beat:
    build: ../backend
    container_name: ivt-celery-beat
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file: ../backend/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  # 單一前端 image — region 執行時看 URL ?wall=left|center|right(不帶=all)。
  # 部署後靠不同 URL 切左/中/右,不需多個 image。
  frontend:
    build: ../frontend
    container_name: ivt-frontend
    restart: unless-stopped
    env_file: ../frontend/.env.local
    depends_on: [backend-web]
    # 注意:3000 常被 RICtester 那套的 front_end 佔用,同機部署要改 IVT_FRONTEND_PORT。
    # nginx 是走 compose 內網 frontend:3000,這個對外埠只供 debug。
    ports: ["127.0.0.1:${IVT_FRONTEND_PORT:-3000}:3000"]

  nginx:
    image: nginx:alpine
    container_name: ivt-nginx
    restart: unless-stopped
    volumes:
      # 樣板:官方 entrypoint 會 envsubst 後輸出成 /etc/nginx/nginx.conf
      - ./nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      # 只替換 RIC_* 前綴,避免動到 nginx 自己的 host / remote_addr 等變數
      NGINX_ENVSUBST_FILTER: "^RIC_"
      # RICtester 位址。預設同機,跨主機改 deploy/.env。
      # 同一台主機上有數套獨立的 tester,各自一組 back_end / adapter:
      #   near = NearRICTester(Near-RT RIC)、non = NonRICTester(Non-RT RIC)
      RIC_HOST: ${RIC_HOST:-host.docker.internal}
      RIC_NEAR_ADAPTER_PORT: ${RIC_NEAR_ADAPTER_PORT:-5100}
      RIC_NEAR_BACKEND_PORT: ${RIC_NEAR_BACKEND_PORT:-5000}
      RIC_NON_ADAPTER_PORT: ${RIC_NON_ADAPTER_PORT:-5110}
      RIC_NON_BACKEND_PORT: ${RIC_NON_BACKEND_PORT:-5010}
      RIC_HLS_PORT: ${RIC_HLS_PORT:-8890}
      # imctrl —— 另一台主機,只有 adapter
      RIC_IM_HOST: ${RIC_IM_HOST:-host.docker.internal}
      RIC_IM_ADAPTER_PORT: ${RIC_IM_ADAPTER_PORT:-8012}
    # RIC_HOST 用預設 host.docker.internal(同機)時才需要
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 單一入口 —— ?wall=left / center / right 切畫面。
    # ⚠ 這是唯一對外的埠。其餘服務一律綁 127.0.0.1:上面那些埠只給本機除錯
    #   用,不能再對 0.0.0.0 發布 —— 2026-09-18 就是因為 Next.js 直接曝露在
    #   0.0.0.0:3005(繞過 nginx)被植入 XMRig 挖礦程式。
    ports: ["${IVT_NGINX_PORT:-8080}:80"]
    depends_on: [frontend, backend-web, backend-ws, mediamtx]

volumes:
  postgres_data:
  redis_data:
  minio_data:
