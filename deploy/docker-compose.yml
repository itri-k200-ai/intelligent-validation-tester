services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ivt-postgres
    environment:
      POSTGRES_DB: ivt
      POSTGRES_USER: ivt
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ivtpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # host 5432 留給 near-rt-ric agent、5433 留給 imctrl-db；IVT 用 5434 避免衝突
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivt"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ivt-redis
    volumes: [redis_data:/data]
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    container_name: ivt-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [minio_data:/data]
    ports: ["9000:9000", "9001:9001"]

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: ivt-mediamtx
    volumes:
      - ../media-server/mediamtx.yml:/mediamtx.yml
    ports: ["8554:8554", "8888:8888", "9997:9997"]

  backend-web:
    build: ../backend
    container_name: ivt-backend-web
    command: gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 3
    env_file: ../backend/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    # host 8000 留給 near-rt-ric agent；正式入口走 nginx :8080
    ports: ["8002:8000"]

  backend-ws:
    build: ../backend
    container_name: ivt-backend-ws
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    env_file: ../backend/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8001:8001"]

  celery-worker:
    build: ../backend
    container_name: ivt-celery
    command: celery -A config worker -l info
    env_file: ../backend/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  celery-beat:
    build: ../backend
    container_name: ivt-celery-beat
    command: celery -A config beat -l info
    env_file: ../backend/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  # 單一前端 image — region 執行時看 URL ?wall=left|center|right(不帶=all)。
  # 部署後靠不同 URL 切左/中/右,不需多個 image。
  frontend:
    build: ../frontend
    container_name: ivt-frontend
    env_file: ../frontend/.env.local
    depends_on: [backend-web]
    ports: ["3000:3000"]

  nginx:
    image: nginx:alpine
    container_name: ivt-nginx
    volumes:
      # 樣板:官方 entrypoint 會 envsubst 後輸出成 /etc/nginx/nginx.conf
      - ./nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      # 只替換 RIC_* 前綴,避免動到 nginx 自己的 host / remote_addr 等變數
      NGINX_ENVSUBST_FILTER: "^RIC_"
      # RICtester 位址。預設同機,跨主機改 deploy/.env。
      # 同一台主機上有數套獨立的 tester,各自一組 back_end / adapter:
      #   near = NearRICTester(Near-RT RIC)、non = NonRICTester(Non-RT RIC)
      RIC_HOST: ${RIC_HOST:-host.docker.internal}
      RIC_NEAR_ADAPTER_PORT: ${RIC_NEAR_ADAPTER_PORT:-5100}
      RIC_NEAR_BACKEND_PORT: ${RIC_NEAR_BACKEND_PORT:-5000}
      RIC_NON_ADAPTER_PORT: ${RIC_NON_ADAPTER_PORT:-5110}
      RIC_NON_BACKEND_PORT: ${RIC_NON_BACKEND_PORT:-5010}
      RIC_HLS_PORT: ${RIC_HLS_PORT:-8890}
    # RIC_HOST 用預設 host.docker.internal(同機)時才需要
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 單一入口 :8080 —— ?wall=left / center / right 切畫面
    ports: ["8080:80"]
    depends_on: [frontend, backend-web, backend-ws, mediamtx]

volumes:
  postgres_data:
  redis_data:
  minio_data:
