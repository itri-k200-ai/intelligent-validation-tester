services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ivt-postgres
    environment:
      POSTGRES_DB: ivt
      POSTGRES_USER: ivt
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ivtpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # host 5432 留給 near-rt-ric agent；IVT 對 host 開 5433 方便 debug
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivt"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ivt-redis
    volumes: [redis_data:/data]
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    container_name: ivt-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [minio_data:/data]
    ports: ["9000:9000", "9001:9001"]

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: ivt-mediamtx
    volumes:
      - ../media-server/mediamtx.yml:/mediamtx.yml
    ports: ["8554:8554", "8888:8888", "9997:9997"]

  backend-web:
    build: ../backend
    container_name: ivt-backend-web
    command: gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 3
    env_file: ../backend/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    # host 8000 留給 near-rt-ric agent；正式入口走 nginx :8080
    ports: ["8002:8000"]

  backend-ws:
    build: ../backend
    container_name: ivt-backend-ws
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    env_file: ../backend/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8001:8001"]

  celery-worker:
    build: ../backend
    container_name: ivt-celery
    command: celery -A config worker -l info
    env_file: ../backend/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  celery-beat:
    build: ../backend
    container_name: ivt-celery-beat
    command: celery -A config beat -l info
    env_file: ../backend/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  frontend:
    build: ../frontend
    container_name: ivt-frontend
    env_file: ../frontend/.env.local
    depends_on: [backend-web]
    ports: ["3000:3000"]

  # 電視牆「中牆」單螢幕 build —— 同一份前端,build 時指定 region=center。
  # 對外走 nginx :8081(見 nginx.conf),/api、/ws 一樣轉後端維持同源。
  frontend-center:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_WALL_REGION: center
    container_name: ivt-frontend-center
    env_file: ../frontend/.env.local
    depends_on: [backend-web]

  # 電視牆「右翼」單螢幕 build —— region=right,對外走 nginx :8082。
  frontend-right:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_WALL_REGION: right
    container_name: ivt-frontend-right
    env_file: ../frontend/.env.local
    depends_on: [backend-web]

  # 左螢幕「待測物選擇器」—— 獨立前後端、獨立 URL(:3100)。
  # 之後會抽成 git submodule 由對接團隊維護;先放這裡方便整套一起測。
  selector:
    build: ../selector-app
    container_name: ivt-selector
    environment:
      PORT: 3100
      IVT_API_BASE: http://backend-web:8000
      WALL_SERVICE_TOKEN: ${WALL_SERVICE_TOKEN:-dev-wall-token}
    depends_on: [backend-web]
    # 左螢幕 — 三面牆連續 port 的第一個
    ports: ["8081:3100"]

  nginx:
    image: nginx:alpine
    container_name: ivt-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-backend.inc:/etc/nginx/conf.d/ivt-backend.inc:ro
    # 8080 全貌預覽 / 8082 中牆 / 8083 右翼(左螢幕 selector 是 8081)
    ports: ["8080:80", "8082:81", "8083:82"]
    depends_on:
      [frontend, frontend-center, frontend-right, backend-web, backend-ws, mediamtx]

volumes:
  postgres_data:
  redis_data:
  minio_data:
