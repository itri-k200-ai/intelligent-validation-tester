worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream frontend        { server frontend:3000; }
    upstream frontend_center { server frontend-center:3000; }
    upstream frontend_right  { server frontend-right:3000; }
    upstream backend_web     { server backend-web:8000; }
    upstream backend_ws      { server backend-ws:8001; }
    upstream mediamtx_hls    { server mediamtx:8888; }

    # 三面牆共用的後端路由(api / admin / static / ws / hls),各 server 都 include。
    # 這樣三個 port 都是同源打同一組後端,前端相對路徑 /api、/ws 免改。

    server {
        listen 80;   # :8080 — 整塊全貌預覽
        server_name _;
        include /etc/nginx/conf.d/ivt-backend.inc;
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 81;   # :8081 — 中牆
        server_name _;
        include /etc/nginx/conf.d/ivt-backend.inc;
        location / {
            proxy_pass         http://frontend_center;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 82;   # :8082 — 右翼
        server_name _;
        include /etc/nginx/conf.d/ivt-backend.inc;
        location / {
            proxy_pass         http://frontend_right;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
