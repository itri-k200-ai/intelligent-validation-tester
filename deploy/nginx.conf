worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream frontend      { server frontend:3000; }
    upstream backend_web   { server backend-web:8000; }
    upstream backend_ws    { server backend-ws:8001; }
    # RICtester(另一個 compose,經宿主機埠;nginx 服務需 extra_hosts host-gateway)
    upstream ric_adapter   { server host.docker.internal:5110; }
    upstream ric_backend   { server host.docker.internal:5010; }
    # 環境影像 HLS —— 攝影機拆回 IVT 通用層,走 ivt-mediamtx(不再是 RICtester)
    upstream ivt_hls       { server mediamtx:8888; }

    # 單一入口。前端一份 image,靠 URL ?wall=left|center|right 切畫面。
    server {
        listen 80;
        server_name _;

        # ── RICtester 整合(電視牆資料來源)──
        # 左牆驅動介面:adapter /autoTest/*
        location /autoTest/ {
            proxy_pass         http://ric_adapter;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }
        # 中/右牆完整資料:RICtester back_end(比 /api/ 更長的前綴,優先匹配)
        location /api/back_end/ {
            proxy_pass         http://ric_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        location /api/ {
            proxy_pass         http://backend_web;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass         http://backend_web;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /static/ {
            proxy_pass         http://backend_web;
        }

        location /ws/ {
            proxy_pass         http://backend_ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 環境攝影機 HLS —— IVT 通用層 mediamtx(去掉 /hls 前綴)
        location /hls/ {
            proxy_pass         http://ivt_hls/;
            proxy_set_header   Host              $host;
            add_header         Cache-Control     no-cache;
        }

        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
